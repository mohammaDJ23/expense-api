services:
    expense-api:
        image: ${IMAGE_NAME:?ERROR IMAGE_NAME is required}
        env_file:
            - .env.production
        environment:
            - DATABASE_PASSWORD_FILE=/run/secrets/database_password
            - REDIS_PASSWORD_FILE=/run/secrets/redis_password
            - JWT_SECRET_FILE=/run/secrets/jwt_secret
            - MAIL_USERNAME_FILE=/run/secrets/mail_username
            - MAIL_PASSWORD_FILE=/run/secrets/mail_password
            - GOOGLE_OAUTH_CLIENT_ID_FILE=/run/secrets/google_oauth_client_id
            - GOOGLE_OAUTH_CLIENT_SECRET_FILE=/run/secrets/google_oauth_client_secret
        ports:
            - '127.0.0.1:3000:3000'
        networks:
            - expense-api-network
            - expense-api-network-internal
        healthcheck:
            test:
                - 'CMD-SHELL'
                - 'curl -s http://localhost:3000/v1/api/health | grep -q "\"status\":\"ok\"" || exit 1'
            interval: 15s
            timeout: 5s
            start_period: 30s
            retries: 3
        secrets:
            - database_password
            - redis_password
            - jwt_secret
            - mail_username
            - mail_password
            - google_oauth_client_id
            - google_oauth_client_secret
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped
        pull_policy: always
        mem_limit: 512M
        mem_reservation: 256M
        cpus: '0.5'
        init: true
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '3'
        labels:
            service: expense-api
            environment: production

    postgres:
        build:
            context: .
            dockerfile: Dockerfile.postgresql
        environment:
            - POSTGRES_DB=expense_api_prod
            - POSTGRES_USER=expense_api
            - POSTGRES_PASSWORD_FILE=/run/secrets/database_password
            - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
            - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
            - WALG_FILE_PREFIX=/db_backup
            - WALG_COMPRESSION_METHOD=brotli
            - PGHOST=/var/run/postgresql
            - PGPORT=5432
            - PGDATABASE=expense_api_prod
            - PGUSER=expense_api
        command:
            - postgres
            - -c
            - wal_level=logical
            - -c
            - max_replication_slots=10
            - -c
            - max_wal_senders=10
            - -c
            - archive_mode=on
            - -c
            - archive_timeout=60s
            - -c
            - archive_command=wal-g wal-push %p
        secrets:
            - database_password
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./db_backup:/db_backup
        networks:
            - expense-api-network-internal
        healthcheck:
            test:
                - 'CMD-SHELL'
                - 'pg_isready -U expense_api'
            interval: 15s
            timeout: 5s
            start_period: 30s
            retries: 3
        restart: unless-stopped
        mem_limit: 1G
        mem_reservation: 512M
        cpus: '1'
        init: true
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '3'

    redis:
        image: redis:7-alpine
        command: >
            sh -c "
            redis-server 
                --requirepass \"$$(cat /run/secrets/redis_password)\"
                --appendonly yes
            "
        secrets:
            - redis_password
        volumes:
            - redis-data:/data
        networks:
            - expense-api-network-internal
        healthcheck:
            test:
                - 'CMD'
                - 'redis-cli'
                - 'ping'
            interval: 15s
            timeout: 5s
            start_period: 30s
            retries: 3
        restart: unless-stopped
        mem_limit: 256M
        mem_reservation: 128M
        cpus: '0.5'
        init: true
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - SETGID
            - SETUID
            - DAC_OVERRIDE
        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '3'

volumes:
    postgres-data:
        driver: local
    redis-data:
        driver: local

secrets:
    database_password:
        file: ./secrets/database_password.txt
    redis_password:
        file: ./secrets/redis_password.txt
    jwt_secret:
        file: ./secrets/jwt_secret.txt
    mail_username:
        file: ./secrets/mail_username.txt
    mail_password:
        file: ./secrets/mail_password.txt
    google_oauth_client_id:
        file: ./secrets/google_oauth_client_id.txt
    google_oauth_client_secret:
        file: ./secrets/google_oauth_client_secret.txt

networks:
    expense-api-network:
        driver: bridge
    expense-api-network-internal:
        driver: bridge
        internal: true
