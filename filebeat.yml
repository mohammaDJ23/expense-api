filebeat.inputs:
    - type: container
      enabled: true
      paths:
          - /var/lib/docker/containers/*/*.log
      processors:
          - add_fields:
                target: ''
                fields:
                    environment: 'production'
                    service: 'expense-api'

output.elasticsearch:
    hosts: ['${ELASTICSEARCH_HOSTS}']
    username: '${ELASTICSEARCH_USERNAME}'
    password: '${ELASTICSEARCH_PASSWORD}'
    index: 'expense-api-logs-%{+yyyy.MM.dd}'
