services:
    expense-api:
        image: ${IMAGE_NAME:?ERROR IMAGE_NAME is required}
        env_file:
            - .env.production
        environment:
            - DATABASE_PASSWORD_FILE=/run/secrets/database_password
            - REDIS_PASSWORD_FILE=/run/secrets/redis_password
            - JWT_SECRET_FILE=/run/secrets/jwt_secret
            - MAIL_USERNAME_FILE=/run/secrets/mail_username
            - MAIL_PASSWORD_FILE=/run/secrets/mail_password
            - ELASTICSEARCH_PASSWORD_FILE=/run/secrets/elasticsearch_password
            - GOOGLE_OAUTH_CLIENT_ID_FILE=/run/secrets/google_oauth_client_id
            - GOOGLE_OAUTH_CLIENT_SECRET_FILE=/run/secrets/google_oauth_client_secret
        build:
            context: .
            target: production
            dockerfile: Dockerfile
        networks:
            - expense-api-network
            - expense-api-network-internal
        healthcheck:
            test:
                - 'CMD-SHELL'
                - 'curl -s http://localhost:3000/v1/api/health | grep -q "\"status\":\"ok\"" || exit 1'
            interval: 15s
            timeout: 5s
            start_period: 60s
            retries: 3
        secrets:
            - database_password
            - redis_password
            - jwt_secret
            - mail_username
            - mail_password
            - google_oauth_client_id
            - google_oauth_client_secret
            - elasticsearch_password
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            kafka:
                condition: service_healthy
            debezium-connect:
                condition: service_healthy
            debezium-init:
                condition: service_completed_successfully
            elasticsearch:
                condition: service_healthy
        restart: unless-stopped
        pull_policy: build
        mem_limit: 512M
        mem_reservation: 256M
        cpus: '0.5'
        init: true
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '3'
        labels:
            service: expense-api
            environment: production

    postgres:
        build:
            context: .
            dockerfile: Dockerfile.postgresql.production
        environment:
            - POSTGRES_DB=expense_api_prod
            - POSTGRES_USER=expense_api
            - POSTGRES_PASSWORD_FILE=/run/secrets/database_password
            - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
            - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
            - WALG_FILE_PREFIX=/db_backup
            - WALG_COMPRESSION_METHOD=brotli
            - PGHOST=/var/run/postgresql
            - PGPORT=5432
            - PGDATABASE=expense_api_prod
            - PGUSER=expense_api
        command:
            - postgres
            - -c
            - wal_level=logical
            - -c
            - max_replication_slots=10
            - -c
            - max_wal_senders=10
            - -c
            - archive_mode=on
            - -c
            - archive_timeout=60s
            - -c
            - archive_command=wal-g wal-push %p
        secrets:
            - database_password
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./db_backup:/db_backup
        networks:
            - expense-api-network-internal
        healthcheck:
            test:
                - 'CMD-SHELL'
                - 'pg_isready -U expense_api'
            interval: 15s
            timeout: 5s
            start_period: 60s
            retries: 3
        restart: unless-stopped
        mem_limit: 1G
        mem_reservation: 512M
        cpus: '1'
        init: true
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '3'

    redis:
        image: redis:7-alpine
        command: >
            sh -c "
            redis-server 
                --requirepass \"$$(cat /run/secrets/redis_password)\"
                --appendonly yes
            "
        secrets:
            - redis_password
        volumes:
            - redis-data:/data
        networks:
            - expense-api-network-internal
        healthcheck:
            test:
                - 'CMD'
                - 'redis-cli'
                - 'ping'
            interval: 15s
            timeout: 5s
            start_period: 60s
            retries: 3
        restart: unless-stopped
        mem_limit: 256M
        mem_reservation: 128M
        cpus: '0.5'
        init: true
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - SETGID
            - SETUID
            - DAC_OVERRIDE
        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '3'

    kafka:
        image: apache/kafka:4.0.0
        restart: unless-stopped
        environment:
            - KAFKA_NODE_ID=1
            - KAFKA_PROCESS_ROLES=broker,controller
            - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
            - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
            - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
            - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
            - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
            - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
            - KAFKA_LOG_DIRS=/var/lib/kafka/data
            - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
            - KAFKA_DELETE_TOPIC_ENABLE=true
            - KAFKA_LOG_RETENTION_HOURS=720
            - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
            - KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS=1
            - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
            - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
        volumes:
            - kafka_data:/var/lib/kafka/data
        healthcheck:
            test:
                - 'CMD-SHELL'
                - '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1'
            interval: 15s
            timeout: 5s
            start_period: 60s
            retries: 3
        networks:
            - expense-api-network-internal
        mem_limit: 1G
        mem_reservation: 512M
        cpus: '1.0'
        init: true
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

    debezium-connect:
        image: mohammadnowresideh1997/debezium-connect:3.0.8.Final
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_healthy
        environment:
            - BOOTSTRAP_SERVERS=kafka:9092
            - GROUP_ID='1'
            - CONFIG_STORAGE_TOPIC=connect_configs
            - OFFSET_STORAGE_TOPIC=connect_offsets
            - STATUS_STORAGE_TOPIC=connect_statuses
            - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
            - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
            - KEY_CONVERTER_SCHEMAS_ENABLE=false
            - VALUE_CONVERTER_SCHEMAS_ENABLE=false
            - CONNECT_REST_ADVERTISED_HOST_NAME=debezium-connect
            - CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR=1
            - CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR=1
            - CONNECT_STATUS_STORAGE_REPLICATION_FACTOR=1
            - CONNECT_REST_PORT=8083
            - CONNECT_LOG4J_ROOT_LOGLEVEL=DEBUG
        healthcheck:
            test:
                - 'CMD-SHELL'
                - 'curl -fs http://localhost:8083/connectors >/dev/null'
            interval: 15s
            timeout: 5s
            start_period: 60s
            retries: 3
        networks:
            - expense-api-network-internal
        mem_limit: 768M
        mem_reservation: 384M
        cpus: '0.75'
        init: true
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

    debezium-init:
        build:
            context: .
            dockerfile: Dockerfile.debeziumInit
        restart: no
        depends_on:
            debezium-connect:
                condition: service_healthy
        environment:
            - DATABASE_HOST=postgres
            - DATABASE_PORT=5432
            - DATABASE_NAME=expense_api_prod
            - DATABASE_USER=expense_api
            - DATABASE_PASSWORD_FILE=/run/secrets/database_password
        secrets:
            - database_password
        networks:
            - expense-api-network-internal
        init: true
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        logging:
            driver: json-file
            options:
                max-size: '1m'
                max-file: '1'

    elasticsearch:
        build:
            context: .
            dockerfile: Dockerfile.elasticsearch
        restart: unless-stopped
        environment:
            - node.name=es01
            - discovery.type=single-node
            - cluster.name=expense-api
            - xpack.security.enabled=true
            - xpack.security.http.ssl.enabled=false
            - ELASTIC_PASSWORD_FILE=/run/secrets/elasticsearch_password
            - xpack.security.enrollment.enabled=false
            - bootstrap.memory_lock=true
            - ES_JAVA_OPTS=-Xms1g -Xmx1g
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65535
                hard: 65535
        secrets:
            - elasticsearch_password
        volumes:
            - elasticsearch-data:/usr/share/elasticsearch/data
        healthcheck:
            test:
                - 'CMD-SHELL'
                - >
                    curl -fs -u elastic:$(cat /run/secrets/elasticsearch_password)
                    "http://localhost:9200/_cluster/health?wait_for_status=green&timeout=60s"
                    >/dev/null
            interval: 15s
            timeout: 5s
            start_period: 60s
            retries: 3
        networks:
            - expense-api-network-internal
        mem_limit: 4G
        mem_reservation: 2G
        cpus: '2'
        init: true
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: '50m'
                max-file: '5'

volumes:
    postgres-data:
        driver: local
    redis-data:
        driver: local
    kafka_data:
        driver: local
    elasticsearch-data:
        driver: local

secrets:
    database_password:
        file: ./secrets/database_password.txt
    redis_password:
        file: ./secrets/redis_password.txt
    jwt_secret:
        file: ./secrets/jwt_secret.txt
    mail_username:
        file: ./secrets/mail_username.txt
    mail_password:
        file: ./secrets/mail_password.txt
    google_oauth_client_id:
        file: ./secrets/google_oauth_client_id.txt
    google_oauth_client_secret:
        file: ./secrets/google_oauth_client_secret.txt
    elasticsearch_password:
        file: ./secrets/elasticsearch_password.txt

networks:
    expense-api-network:
        driver: bridge
    expense-api-network-internal:
        driver: bridge
        internal: true
