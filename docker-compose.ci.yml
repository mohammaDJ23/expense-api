services:
    expense-api:
        image: ${IMAGE_NAME:?ERROR IMAGE_NAME is required}
        environment:
            DATABASE_PASSWORD_FILE: /run/secrets/database_password
            REDIS_PASSWORD_FILE: /run/secrets/redis_password
            JWT_SECRET_FILE: /run/secrets/jwt_secret
        build:
            context: .
            target: production
            dockerfile: Dockerfile
        networks:
            - expense-api-network
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'curl -s http://localhost:${PORT:-3000}/v1/api/health | jq -e ".status == \"ok\" or .response.status == \"ok\"" || exit 1',
                ]
            interval: 5s
            timeout: 3s
            start_period: 20s
            retries: 2
        secrets:
            - database_password
            - redis_password
            - jwt_secret
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped
        pull_policy: never

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${DATABASE_NAME:-expense_api_ci}
            POSTGRES_USER: ${DATABASE_USER:-expense_api}
            POSTGRES_PASSWORD_FILE: /run/secrets/database_password
            POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
            POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        secrets:
            - database_password
        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks:
            - expense-api-network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-expense_api}']
            interval: 5s
            timeout: 3s
            start_period: 20s
            retries: 2
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        command: >
            sh -c "
            redis-server 
                --requirepass \"$$(cat /run/secrets/redis_password)\"
                --appendonly yes
            "
        secrets:
            - redis_password
        volumes:
            - redis-data:/data
        networks:
            - expense-api-network
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            start_period: 20s
            retries: 2
        restart: unless-stopped

volumes:
    postgres-data:
        driver: local
    redis-data:
        driver: local

secrets:
    database_password:
        file: ./secrets/database_password.txt
    redis_password:
        file: ./secrets/redis_password.txt
    jwt_secret:
        file: ./secrets/jwt_secret.txt

networks:
    expense-api-network:
        driver: bridge
