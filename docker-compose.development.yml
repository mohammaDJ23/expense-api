services:
    expense-api:
        image: ${IMAGE_NAME:?ERROR IMAGE_NAME is required}
        stdin_open: true
        tty: true
        environment:
            DATABASE_PASSWORD_FILE: /run/secrets/database_password
            REDIS_PASSWORD_FILE: /run/secrets/redis_password
            JWT_SECRET_FILE: /run/secrets/jwt_secret
        build:
            context: .
            target: development
            dockerfile: Dockerfile
        ports:
            - '${PORT:-4000}:4000'
            - '${DEBUG_PORT:-9229}:9229'
        networks:
            - expense-api-network
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'sh -c "curl -f http://localhost:${PORT:-4000}/v1/api/health || exit 1"',
                ]
            interval: 5s
            timeout: 3s
            start_period: 20s
            retries: 2
        secrets:
            - database_password
            - redis_password
            - jwt_secret
        volumes:
            - ./src:/usr/src/app/src
            - ./package.json:/usr/src/app/package.json
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: on-failure:3
        pull_policy: never

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${DATABASE_NAME:-expense_api_dev}
            POSTGRES_USER: ${DATABASE_USER:-expense_api}
            POSTGRES_PASSWORD_FILE: /run/secrets/database_password
            POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
            POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        secrets:
            - database_password
        volumes:
            - postgres-data:/var/lib/postgresql/data
        ports:
            - '${DATABASE_PORT:-5432}:5432'
        networks:
            - expense-api-network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-expense_api}']
            interval: 5s
            timeout: 3s
            start_period: 20s
            retries: 2
        restart: on-failure:3

    redis:
        image: redis:7-alpine
        command: >
            redis-server
              --requirepass file:/run/secrets/redis_password
              --appendonly yes
              --save 900 1
              --save 300 10
              --save 60 10000
              --maxmemory 256mb
              --maxmemory-policy allkeys-lru
              --protected-mode yes
        secrets:
            - redis_password
        volumes:
            - redis-data:/data
        ports:
            - '${REDIS_PORT:-6379}:6379'
        networks:
            - expense-api-network
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'cat /run/secrets/redis_password | xargs redis-cli -a --no-auth-warning ping | grep PONG || exit 1',
                ]
            interval: 5s
            timeout: 3s
            start_period: 20s
            retries: 2
        restart: on-failure:3

volumes:
    postgres-data:
        driver: local
    redis-data:
        driver: local

secrets:
    database_password:
        file: ./secrets/database_password.txt
    redis_password:
        file: ./secrets/redis_password.txt
    jwt_secret:
        file: ./secrets/jwt_secret.txt

networks:
    expense-api-network:
        driver: bridge
