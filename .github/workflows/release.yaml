name: Release

on:
    push:
        branches:
            - master

concurrency:
    group: release
    cancel-in-progress: true

env:
    SHA: ${{ github.event.workflow_run.head_sha }}
    RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
    BY: ${{ github.event.workflow_run.actor.login }}

jobs:
    manual-approval:
        runs-on: ubuntu-latest
        environment: production-release
        steps:
            - name: 🛑 Manual Approval Required
              run: |
                  echo "=========================================="
                  echo "🛑 RELEASE APPROVAL REQUIRED"
                  echo "=========================================="
                  echo ""
                  echo "✅ Master Pipeline Verification:"
                  echo "   Run #: ${RUN_NUMBER}"
                  echo "   SHA: ${SHA}"
                  echo "   By: ${BY}"
                  echo ""
                  echo "=========================================="

    create-version:
        needs: manual-approval
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            version: ${{ steps.get-version.outputs.version }}
            commit_sha: ${{ steps.get-commit-sha.outputs.commit_sha }}
        steps:
            - name: Checkout the source
              uses: actions/checkout@v4
              with:
                  ref: ${{ env.SHA }}
                  fetch-depth: 0
                  token: ${{ secrets.SEMANTIC_RELEASE_BOT_PAT_TOKEN }}

            - name: Install node and node_modules
              uses: ./.github/actions/setup-node

            - name: Create a New version
              id: get-version
              run: pnpm run create:version
              env:
                  GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_BOT_PAT_TOKEN }}

            - name: Detect commit_sha
              id: get-commit-sha
              run: pnpm run detect:commitsha

    expense-api:
        needs: create-version
        timeout-minutes: 30
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the source
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.create-version.outputs.commit_sha }}

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Create secrets for Docker Compose
              run: |
                  mkdir -p secrets
                  echo "${{ secrets.DATABASE_PASSWORD }}" > ./secrets/database_password.txt
                  echo "${{ secrets.REDIS_PASSWORD }}" > ./secrets/redis_password.txt
                  echo "${{ secrets.JWT_SECRET }}" > ./secrets/jwt_secret.txt
                  echo "${{ secrets.MAIL_USERNAME }}" > ./secrets/mail_username.txt
                  echo "${{ secrets.MAIL_PASSWORD }}" > ./secrets/mail_password.txt
                  echo "${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}" > ./secrets/google_oauth_client_id.txt
                  echo "${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}" > ./secrets/google_oauth_client_secret.txt
                  echo "${{ secrets.ELASTICSEARCH_PASSWORD }}" > ./secrets/elasticsearch_password.txt
                  echo "${{ secrets.ARVAN_ACCESS_KEY }}" > ./secrets/arvan_access_key.txt
                  echo "${{ secrets.ARVAN_SECRET_KEY }}" > ./secrets/arvan_secret_key.txt

            - name: Create image name
              id: create-docker-image-name
              run: pnpm run create:app:docker:image:name
              env:
                  TAG: ${{ needs.create-version.outputs.version }}

            - name: Run the ci entrypoint
              run: pnpm run start:docker:ci
              env:
                  IMAGE: ${{ steps.create-docker-image-name.outputs.versioned_image }}

            - name: Scan the docker image
              uses: ./.github/actions/scan-docker-image
              with:
                  image_name: ${{ steps.create-docker-image-name.outputs.versioned_image }}
                  snyk_token: ${{ secrets.SNYK_TOKEN }}

            - name: Tag the images
              run: pnpm run tag:docker:images
              env:
                  SOURCE: ${{ steps.create-docker-image-name.outputs.versioned_image }}
                  TARGET: ${{ steps.create-docker-image-name.outputs.latest_image }}

            - name: Push versioned image to dockerhub
              run: pnpm run push:docker:image
              env:
                  IMAGE: ${{ steps.create-docker-image-name.outputs.versioned_image }}

            - name: Push latest image to dockerhub
              run: pnpm run push:docker:image
              env:
                  IMAGE: ${{ steps.create-docker-image-name.outputs.latest_image }}

            - name: Cleanup secrets
              if: always()
              run: rm -rf ./secrets

            - name: Log out from DockerHub
              if: always()
              run: docker logout

    db-migration:
        needs: [create-version, expense-api]
        timeout-minutes: 30
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the source
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.create-version.outputs.commit_sha }}

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Create image name
              id: create-docker-image-name
              run: pnpm run create:migration:docker:image:name
              env:
                  TAG: ${{ needs.create-version.outputs.version }}

            - name: build the image
              run: pnpm run build:migration:docker:image
              env:
                  IMAGE: ${{ steps.create-docker-image-name.outputs.versioned_image }}

            - name: Scan the docker image
              uses: ./.github/actions/scan-docker-image
              with:
                  image_name: ${{ steps.create-docker-image-name.outputs.versioned_image }}
                  snyk_token: ${{ secrets.SNYK_TOKEN }}

            - name: Tag the images
              run: pnpm run tag:docker:images
              env:
                  SOURCE: ${{ steps.create-docker-image-name.outputs.versioned_image }}
                  TARGET: ${{ steps.create-docker-image-name.outputs.latest_image }}

            - name: Push versioned image to dockerhub
              run: pnpm run push:docker:image
              env:
                  IMAGE: ${{ steps.create-docker-image-name.outputs.versioned_image }}

            - name: Push latest image to dockerhub
              run: pnpm run push:docker:image
              env:
                  IMAGE: ${{ steps.create-docker-image-name.outputs.latest_image }}

            - name: Log out from DockerHub
              if: always()
              run: docker logout
