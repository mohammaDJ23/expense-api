name: Release

on:
    workflow_run:
        workflows: ['Master CI']
        types:
            - completed
        branches:
            - master

concurrency:
    group: release
    cancel-in-progress: true

env:
    SHA: ${{ github.event.workflow_run.head_sha }}
    RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
    BY: ${{ github.event.workflow_run.actor.login }}

jobs:
    manual-approval:
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        environment: production-release
        steps:
            - name: 🛑 Manual Approval Required
              run: |
                  echo "=========================================="
                  echo "🛑 RELEASE APPROVAL REQUIRED"
                  echo "=========================================="
                  echo ""
                  echo "✅ Master Pipeline Verification:"
                  echo "   Run #: ${RUN_NUMBER}"
                  echo "   SHA: ${SHA}"
                  echo "   By: ${BY}"
                  echo ""
                  echo "📋 Before approving, verify:"
                  echo "   1. Master Pipeline completed successfully"
                  echo "   2. No Master Pipeline is currently running"
                  echo "   3. You want to proceed with this release"
                  echo ""
                  echo "⚠️  This release will use SHA:"
                  echo "   ${SHA}"
                  echo ""
                  echo "=========================================="

    create-version:
        needs: manual-approval
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            version: ${{ steps.get-version.outputs.version }}
            commit_sha: ${{ steps.get-commit-sha.outputs.commit_sha }}
        steps:
            - name: Checkout the source
              uses: actions/checkout@v4
              with:
                  ref: ${{ env.SHA }}
                  fetch-depth: 0
                  token: ${{ secrets.SEMANTIC_RELEASE_BOT_PAT_TOKEN }}

            - name: Install node and node_modules
              uses: ./.github/actions/setup-node

            - name: Create a New version
              id: get-version
              run: pnpm run create:version:ci
              env:
                  GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_BOT_PAT_TOKEN }}

            - name: Detect commit_sha
              id: get-commit-sha
              run: pnpm run detect:commitsha:ci

    run-test-push:
        needs: create-version
        timeout-minutes: 30
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the source
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.create-version.outputs.commit_sha }}

            - name: Install node and node_modules
              uses: ./.github/actions/setup-node

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Create secrets for Docker Compose
              run: |
                  mkdir -p secrets
                  echo "${{ secrets.DATABASE_PASSWORD }}" > ./secrets/database_password.txt
                  echo "${{ secrets.REDIS_PASSWORD }}" > ./secrets/redis_password.txt
                  echo "${{ secrets.JWT_SECRET }}" > ./secrets/jwt_secret.txt
                  echo "${{ secrets.SMTP_PASSWORD }}" > ./secrets/smtp_password.txt

            - name: Run the entrypoint
              id: run-entrypoint
              run: pnpm run start:docker:ci:production
              env:
                  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
                  TAG: ${{ needs.create-version.outputs.version }}

            - name: Scan the docker image
              uses: ./.github/actions/scan-docker-image
              with:
                  image_name: ${{ steps.run-entrypoint.outputs.image_name }}
                  snyk_token: ${{ secrets.SNYK_TOKEN }}

            - name: Cleanup secrets
              if: always()
              run: rm -rf ./secrets

            - name: Log out from DockerHub
              if: always()
              run: docker logout
