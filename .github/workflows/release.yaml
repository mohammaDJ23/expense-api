name: Release

on:
    workflow_run:
        workflows: ['Master CI']
        types:
            - completed
        branches:
            - master

concurrency:
    group: release
    cancel-in-progress: true

env:
    SHA: ${{ github.event.workflow_run.head_sha }}
    RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
    BY: ${{ github.event.workflow_run.actor.login }}

jobs:
    manual-approval:
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        environment: production-release
        steps:
            - name: 🛑 Manual Approval Required
              run: |
                  echo "=========================================="
                  echo "🛑 RELEASE APPROVAL REQUIRED"
                  echo "=========================================="
                  echo ""
                  echo "✅ Master Pipeline Verification:"
                  echo "   Run #: ${RUN_NUMBER}"
                  echo "   SHA: ${SHA}"
                  echo "   By: ${BY}"
                  echo ""
                  echo "📋 Before approving, verify:"
                  echo "   1. Master Pipeline completed successfully"
                  echo "   2. No Master Pipeline is currently running"
                  echo "   3. You want to proceed with this release"
                  echo ""
                  echo "⚠️  This release will use SHA:"
                  echo "   ${SHA}"
                  echo ""
                  echo "=========================================="

    create-version:
        needs: manual-approval
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.get-version.outputs.version }}
            commit_sha: ${{ steps.get-commit-sha.outputs.commit_sha }}
        steps:
            - name: Checkout the source
              uses: actions/checkout@v4
              with:
                  ref: ${{ env.SHA }}
                  fetch-depth: 0

            - name: Install node and node_modules
              uses: ./.github/actions/setup-node

            - name: Detect commit_sha
              id: get-commit-sha
              run: pnpm run detect:commitsha:ci

            - name: Create a New version
              id: get-version
              run: create:version:ci

    run-test-push:
        needs: create-version
        timeout-minutes: 30
        runs-on: ubuntu-latest
        outputs:
            tagged_image: ${{ steps.run-enptrypoint.outputs.tagged_image }}
            latest_image: ${{ steps.run-enptrypoint.outputs.latest_image }}
        steps:
            - name: Checkout the source
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.create-version.outputs.commit_sha }}

            - name: Install node and node_modules
              uses: ./.github/actions/setup-node

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Create secrets for Docker Compose
              run: |
                  mkdir -p secrets
                  echo "${{ secrets.DATABASE_PASSWORD }}" > ./secrets/database_password.txt
                  echo "${{ secrets.REDIS_PASSWORD }}" > ./secrets/redis_password.txt
                  echo "${{ secrets.JWT_SECRET }}" > ./secrets/jwt_secret.txt

            - name: Run the enptrypoint
              id: run-enptrypoint
              run: pnpm run start:docker:ci
              env:
                  MODE: ci_production
                  COMPOSE_FILE: docker-compose.ci.production.yml
                  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/${{ vars.APP_NAME }}-production:${{ needs.create-version.outputs.commit_sha }}

            - name: Scan the docker image
              uses: ./.github/actions/scan-docker-image
              with:
                  image_name: ${{ secrets.DOCKER_USERNAME }}/${{ vars.APP_NAME }}-production:${{ needs.create-version.outputs.commit_sha }}
                  snyk_token: ${{ secrets.SNYK_TOKEN }}

            - name: Cleanup secrets
              if: always()
              run: rm -rf ./secrets

            - name: Log out from DockerHub
              if: always()
              run: docker logout

    release-summary:
        needs: [manual-approval, create-version, run-test-push]
        runs-on: ubuntu-latest
        env:
            VERSION: ${{ needs.create-version.outputs.version }}
            TAGGED_IMAGE: ${{ needs.run-test-push.outputs.tagged_image }}
            LATEST_IMAGE: ${{ needs.run-test-push.outputs.latest_image }}
            UPDATED_SHA: ${{ needs.create-version.outputs.commit_sha }}
            WORKFLOW: ${{ github.workflow }}
        steps:
            - name: Release Summary
              run: |
                  echo "🚀 RELEASE WORKFLOW SUMMARY"
                  echo "==========================="
                  echo ""
                  echo "Workflow: ${WORKFLOW}"
                  echo "Triggered by: Master Pipeline #${RUN_NUMBER}"
                  echo "Original SHA: ${SHA}"
                  echo "Updated SHA: ${UPDATED_SHA}"
                  echo ""

                  echo "✅ NEW RELEASE CREATED!"
                  echo "New Version: v${VERSION}"
                  echo ""
                  echo "📦 Docker Images Published:"
                  echo "   ${TAGGED_IMAGE}"
                  echo "   ${LATEST_IMAGE}"
                  echo ""
