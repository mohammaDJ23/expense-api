name: Mirror Debezium Image

on:
    workflow_dispatch:

env:
    SOURCE_IMAGE: quay.io/debezium/connect:3.0.8.Final
    TARGET_IMAGE: ${{ secrets.DOCKER_USERNAME }}/debezium-connect:3.0.8.Final

jobs:
    mirror:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Pull image
              run: docker pull "$SOURCE_IMAGE"

            - name: Tag image
              run: docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"

            - name: Push image
              run: docker push "$TARGET_IMAGE"
